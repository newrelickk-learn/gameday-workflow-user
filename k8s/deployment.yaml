# GameDay第0章: このPodがリソース（CPU）を使い切っている「primary」役。
# ServiceのselectorがPod-role: primaryのみを向くため、ログインリクエストは常にこのPodに届く。
# 対になる gameday-workflow-user-standby-deployment.yaml は平常なPod（見せかけの比較対象）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameday-workflow-user
  namespace: gameday-workflow
  labels:
    app: gameday-workflow-user
    pod-role: primary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gameday-workflow-user
      pod-role: primary
  template:
    metadata:
      labels:
        app: gameday-workflow-user
        pod-role: primary
    spec:
      containers:
        - name: gameday-workflow-user
          # CIのdeploy.ymlが `kubectl set image` で実際のECRイメージに差し替える。初回applyのみこのタグが使われる。
          image: gameday-workflow-user:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            # GameDay第0章: このPodをリソース飽和役にする。CpuSaturationServiceが起動する。
            - name: USER_POD_ROLE
              value: "primary"
            # 演習中に不安定になった場合の緊急停止スイッチ。falseにしてPodを再起動（例:
            # `kubectl set env deployment/gameday-workflow-user CPU_SATURATION_ENABLED=false -n gameday-workflow`）
            # すれば、イメージの再ビルド・再デプロイなしに即座に負荷を止められる。
            - name: CPU_SATURATION_ENABLED
              value: "true"
            # 通常のCPU飽和（ベースライン）に加え、5分おきに20秒間だけさらに高い負荷に切り替えて
            # スパイクを起こす（New Relic上でより分かりやすい波形にするための演出）。0にすると無効化。
            - name: CPU_SPIKE_INTERVAL_MINUTES
              value: "5"
            - name: CPU_SPIKE_DURATION_SECONDS
              value: "20"
            - name: ASPNETCORE_URLS
              value: "http://+:80"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: gameday-workflow-user-secrets
                  key: connection-string
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: gameday-workflow-user-secrets
                  key: jwt-secret-key
            - name: Jwt__Issuer
              value: "UserService"
            - name: Jwt__Audience
              value: "UserService"
            - name: Jwt__ExpirationMinutes
              value: "60"
            - name: InternalService__ApiKey
              valueFrom:
                secretKeyRef:
                  name: gameday-workflow-user-secrets
                  key: internal-api-key
            - name: Kestrel__Limits__MaxConcurrentConnections
              value: "1000"
            - name: Kestrel__Limits__MaxConcurrentUpgradedConnections
              value: "1000"
            - name: Kestrel__Limits__KeepAliveTimeoutSeconds
              value: "120"
            - name: Kestrel__Limits__RequestHeadersTimeoutSeconds
              value: "30"
            - name: Kestrel__Limits__MaxRequestBodySize
              value: "10485760"
            - name: Database__MaxPoolSize
              value: "200"
            - name: Database__MinPoolSize
              value: "10"
            - name: Database__ConnectionLifetime
              value: "0"
            - name: CORECLR_ENABLE_PROFILING
              value: "1"
            - name: CORECLR_PROFILER
              value: "{36032161-FFC0-4B61-B559-F6C5D41BAE5A}"
            - name: CORECLR_NEWRELIC_HOME
              value: "/usr/local/newrelic-dotnet-agent"
            - name: CORECLR_PROFILER_PATH
              value: "/usr/local/newrelic-dotnet-agent/libNewRelicProfiler.so"
            - name: NEW_RELIC_APP_NAME
              value: "gameday-workflow-user"
            # nri-metadata-injection（Kubernetes統合のMutatingWebhook）を導入していないため、
            # 通常そのWebhookが自動注入するNEW_RELIC_METADATA_KUBERNETES_*をDownward APIで
            # 手動で注入する。これがないと.NETエージェントがどのPodで処理したかをAPM側の
            # トランザクション/エラーに付与できず、OTel側のKubernetesメトリクスと紐付けられない。
            - name: NEW_RELIC_METADATA_KUBERNETES_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NEW_RELIC_METADATA_KUBERNETES_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NEW_RELIC_METADATA_KUBERNETES_CONTAINER_NAME
              value: "gameday-workflow-user"
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: gameday-workflow-newrelic-secrets
                  key: license-key
          resources:
            requests:
              # GameDay第0章: CPU limitを絞ってサチらせるためrequestsも合わせて下げる。
              # memoryはOOM Killedのリスクを避けるため変更しない。
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            # GameDay第0章: CPUがサチっていてもhealth応答が遅れただけで再起動しないよう緩める
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 8
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 8
