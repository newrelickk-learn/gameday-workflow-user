# GameDay第0章: リソースを使い切っていない「standby」役のPod。
# gameday-workflow-user-deployment.yaml（primary、実際にログインを処理する側）と対になる、
# 見せかけの比較対象。Service (gameday-workflow-user) のselectorはpod-role: primaryのみを
# 向くため、このPodはトラフィックを一切受けない。CPUは平常のまま、CpuSaturationServiceも無効。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameday-workflow-user-standby
  namespace: gameday-workflow
  labels:
    app: gameday-workflow-user
    pod-role: standby
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gameday-workflow-user
      pod-role: standby
  template:
    metadata:
      labels:
        app: gameday-workflow-user
        pod-role: standby
    spec:
      containers:
        - name: gameday-workflow-user
          # CIのdeploy.ymlが `kubectl set image` で実際のECRイメージに差し替える。初回applyのみこのタグが使われる。
          image: gameday-workflow-user:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            # GameDay第0章: standby役なのでCPU負荷は発生させない
            - name: USER_POD_ROLE
              value: "standby"
            - name: ASPNETCORE_URLS
              value: "http://+:80"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: gameday-workflow-user-secrets
                  key: connection-string
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: gameday-workflow-user-secrets
                  key: jwt-secret-key
            - name: Jwt__Issuer
              value: "UserService"
            - name: Jwt__Audience
              value: "UserService"
            - name: Jwt__ExpirationMinutes
              value: "60"
            - name: InternalService__ApiKey
              valueFrom:
                secretKeyRef:
                  name: gameday-workflow-user-secrets
                  key: internal-api-key
            - name: Kestrel__Limits__MaxConcurrentConnections
              value: "1000"
            - name: Kestrel__Limits__MaxConcurrentUpgradedConnections
              value: "1000"
            - name: Kestrel__Limits__KeepAliveTimeoutSeconds
              value: "120"
            - name: Kestrel__Limits__RequestHeadersTimeoutSeconds
              value: "30"
            - name: Kestrel__Limits__MaxRequestBodySize
              value: "10485760"
            - name: Database__MaxPoolSize
              value: "200"
            - name: Database__MinPoolSize
              value: "10"
            - name: Database__ConnectionLifetime
              value: "0"
            - name: CORECLR_ENABLE_PROFILING
              value: "1"
            - name: CORECLR_PROFILER
              value: "{36032161-FFC0-4B61-B559-F6C5D41BAE5A}"
            - name: CORECLR_NEWRELIC_HOME
              value: "/usr/local/newrelic-dotnet-agent"
            - name: CORECLR_PROFILER_PATH
              value: "/usr/local/newrelic-dotnet-agent/libNewRelicProfiler.so"
            # primaryと同じappNameにすると、New Relic上で「1 Deployment名 = 1 APMの画面」という
            # 対応が崩れ、K8s側のDeployment名(standby)とAPM上の表示名(primaryと同じ名前)が
            # 食い違って混乱の元になる。standbyだけ別のappNameにして1:1を保つ。
            - name: NEW_RELIC_APP_NAME
              value: "gameday-workflow-user-standby"
            # nri-metadata-injection未導入のため、Downward APIでKubernetesメタデータを手動注入
            # （詳細はdeployment.yamlのコメントを参照）
            - name: NEW_RELIC_METADATA_KUBERNETES_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NEW_RELIC_METADATA_KUBERNETES_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NEW_RELIC_METADATA_KUBERNETES_CONTAINER_NAME
              value: "gameday-workflow-user"
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: gameday-workflow-newrelic-secrets
                  key: license-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
