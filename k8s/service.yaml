apiVersion: v1
kind: Service
metadata:
  name: gameday-workflow-user
  namespace: gameday-workflow
  labels:
    app: gameday-workflow-user
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: gameday-workflow-user
    # GameDay第0章: リソースが飽和している側(primary)のPodだけをエンドポイントにする。
    # standby(gameday-workflow-user-standby-deployment.yaml)には一切ルーティングしない。
    pod-role: primary
